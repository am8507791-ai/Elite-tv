name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Elite Cricket, OU=Elite, O=Elite, L=Elite, S=Elite, C=Elite"

      - name: Generate APK with Capacitor
        run: |
          # Delete potentially corrupt tracked android folder and create fresh
          rm -rf android
          npx cap add android
          npx cap sync android
          
          # Navigate to android folder and build APK
          cd android
          
          # Set executable permissions for gradlew
          chmod +x ./gradlew
          
          # Build release APK
          ./gradlew assembleRelease
          
          cd ..
          
          echo "Locating build tools..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -r | head -n 1)
          
          echo "Signing APK..."
          # The unsigned APK is built at android/app/build/outputs/apk/release/app-release-unsigned.apk
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ -f "$UNSIGNED_APK" ]; then
            mkdir -p final_apk
            # Zipalign
            $BUILD_TOOLS_DIR/zipalign -p -f 4 "$UNSIGNED_APK" final_apk/app-aligned.apk
            # Sign
            $BUILD_TOOLS_DIR/apksigner sign --ks android.keystore --ks-pass pass:android123 --ks-key-alias android --key-pass pass:android123 --out final_apk/Elite-Cricket-TV.apk final_apk/app-aligned.apk
            # Clean up
            rm final_apk/app-aligned.apk
            echo "Successfully generated and signed Elite-Cricket-TV.apk!"
          else
            echo "Error: Could not find $UNSIGNED_APK"
            exit 1
          fi

      - name: Find and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Elite-Cricket-TV-App
          path: final_apk/Elite-Cricket-TV.apk
          if-no-files-found: error
