name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Elite Cricket, OU=Elite, O=Elite, L=Elite, S=Elite, C=Elite"

      - name: Generate APK with Bubblewrap
        run: |
          # Set memory limits for Gradle
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          
          # Create Bubblewrap configuration in the home directory
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          # Execute bubblewrap update to generate project files
          echo "Generating Android project..."
          echo "1.0.0" | npx -y @bubblewrap/cli update --nonInteractive
          
          echo "Building Unsigned APK..."
          npx -y @bubblewrap/cli build --skipSigning --nonInteractive || true
          
          echo "Locating build tools..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -r | head -n 1)
          
          echo "Zipaligning and Signing APK..."
          # Find the unsigned APK
          UNSIGNED_APK=$(find . -name "app-release-unsigned.apk" | head -n 1)
          
          if [ -f "$UNSIGNED_APK" ]; then
            mkdir -p final_apk
            # Zipalign
            $BUILD_TOOLS_DIR/zipalign -p -f 4 "$UNSIGNED_APK" final_apk/app-aligned.apk
            # Sign
            $BUILD_TOOLS_DIR/apksigner sign --ks android.keystore --ks-pass pass:android123 --ks-key-alias android --key-pass pass:android123 --out final_apk/Elite-Cricket-TV.apk final_apk/app-aligned.apk
            # Clean up intermediate aligned apk
            rm final_apk/app-aligned.apk
            echo "Successfully generated and signed Elite-Cricket-TV.apk!"
          else
            echo "Error: Could not find app-release-unsigned.apk"
            exit 1
          fi

      - name: Debug Output
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Listing final APKs:"
          ls -la final_apk/

      - name: Find and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Elite-Cricket-TV-App
          path: final_apk/Elite-Cricket-TV.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Elite Cricket TV App Release (Build ${{ github.run_number }})"
          tag_name: "v1.0.${{ github.run_number }}"
          files: "final_apk/Elite-Cricket-TV.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
