name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Elite Cricket, OU=Elite, O=Elite, L=Elite, S=Elite, C=Elite"

      - name: Generate APK with Bubblewrap
        run: |
          # Set memory limits for Gradle
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          
          # Create Bubblewrap configuration in the home directory to prevent path prompts
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          # Also keep a local copy just in case
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > bubblewrap.json
          
          # Use a Node.js script to robustly initialize Bubblewrap
          cat <<EOF > init_bubblewrap.cjs
          const http = require('http');
          const fs = require('fs');
          const { execSync } = require('child_process');

          const server = http.createServer((req, res) => {
            if (req.url === '/manifest.json') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              // Serve a patched version of the manifest to ensure correct standalone display
              const manifest = JSON.parse(fs.readFileSync('./public/manifest.json', 'utf8'));
              manifest.start_url = "/";
              res.end(JSON.stringify(manifest));
            } else {
              res.writeHead(404);
              res.end();
            }
          }).listen(8089, () => {
            console.log('Local server started on port 8089 for manifest delivery.');
            try {
              // 1. Initialize bubblewrap project using the local HTTP manifest
              execSync('printf "n\\\\n" | npx -y @bubblewrap/cli init --manifest http://localhost:8089/manifest.json --nonInteractive', { stdio: 'inherit' });
              
              // 2. Patch twa-manifest.json with correct production host and downloaded icon
              const twa = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
              twa.host = "ais-pre-gizl2nb4mtsupt34vxzox5-469280658518.asia-southeast1.run.app";
              twa.appVersionName = "1.0.0";
              twa.appVersionCode = 1;
              twa.display = "standalone";
              twa.signingKey = { path: "./android.keystore", alias: "android" };
              fs.writeFileSync('twa-manifest.json', JSON.stringify(twa, null, 2));

              // 3. Update the Android project files with the updated twa-manifest.json
              console.log("Updating Android project scaffolding...");
              execSync('printf "n\\\\n" | npx -y @bubblewrap/cli update --nonInteractive', { stdio: 'inherit' });
              
              console.log("Bubblewrap project successfully generated.");
              process.exit(0);
            } catch (err) {
              console.error("Failed to generate Android project:", err);
              process.exit(1);
            }
          });
          EOF
          
          node init_bubblewrap.cjs
          
          echo "Building APK..."
          # Build signed APK. 
          npx -y @bubblewrap/cli build --signingKeyPath ./android.keystore --signingKeyAlias android --signingKeyPassword android123 --signingKeystorePassword android123 --nonInteractive || \
          npx -y @bubblewrap/cli build --skipSigning --nonInteractive


      - name: Debug Output
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Finding all APK files:"
          find . -name "*.apk"

      - name: Find and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Elite Cricket TV App Release (Build ${{ github.run_number }})"
          tag_name: "v1.0.${{ github.run_number }}"
          files: "**/*.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
